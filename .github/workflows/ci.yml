name: CI Pipeline

on:

  push:
    branches: [ main ]
  
  pull_request:
    branches: [ main ]
  
  workflow_dispatch:


jobs:

  run-test:
    name: Run Tests
    runs-on : ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@
        with: 
          node-version: '20'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Run Tests
        run: npm test